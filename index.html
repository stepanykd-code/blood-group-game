<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#6b1421">
  <title>Краплинки</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3e1720;
      --wine: #701526;
      --cream: #fffaf2;
      --gold: #efbc61;
      --shadow: 0 7px 20px #31101b30;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #e6efed;
      color: var(--ink);
      font-family: "Trebuchet MS", system-ui, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    .game { width: 100vw; height: 100dvh; display: grid; place-items: center; }
    .scene {
      position: relative;
      width: min(100vw, 150vh);
      height: min(100vh, 66.6667vw);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      isolation: isolate;
      background: #edf5f2 url("assets/station-background-desktop.png") center / 100% 100% no-repeat;
      box-shadow: 0 14px 44px #47232b33;
    }
    .hud-stack { display: contents; }
    .station-mark {
      position: absolute;
      z-index: 2;
      top: 2.2%;
      right: 2.3%;
      width: clamp(100px, 14%, 176px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 4px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fffdf8;
      box-shadow: 0 6px 20px #31101b30;
    }
    .station-mark img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
    }
    .target-panel {
      position: absolute;
      z-index: 2;
      left: 73%;
      top: 27%;
      width: 24%;
      min-height: 27%;
      display: grid;
      grid-template-columns: 38% 1fr;
      grid-template-rows: auto auto 1fr;
      align-items: center;
      gap: 0 5%;
      padding: 4.5%;
      border: 2px solid #fff;
      border-radius: 22px;
      background: #fff8ebed;
      box-shadow: var(--shadow);
    }
    .target-kicker { grid-column: 1 / -1; margin: 0 0 5px; font-size: clamp(10px, 1vw, 14px); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #98636a; }
    .target-drop { grid-row: 2 / 4; width: 100%; aspect-ratio: 1; object-fit: contain; border: 3px solid var(--drop-color, #fff); border-radius: 13px; }
    .target-name { margin: 0; font-size: clamp(22px, 3vw, 40px); line-height: 1; font-weight: 1000; color: var(--wine); }
    .target-description { margin: 5px 0 0; font-size: clamp(10px, 1.2vw, 15px); font-weight: 800; color: #76565a; }
    .progress-track { grid-column: 1 / -1; height: 12px; margin-top: 15px; overflow: hidden; border-radius: 99px; background: #eeddda; box-shadow: inset 0 1px 3px #7b334533; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #c52b3a, #85172a); transition: width .22s ease; }
    .progress-count { grid-column: 1 / -1; margin-top: 7px; text-align: right; font-size: clamp(15px, 1.65vw, 22px); font-weight: 1000; color: var(--wine); }
    .board {
      position: absolute;
      z-index: 1;
      left: 21.25%;
      top: 2.25%;
      width: 48.8%;
      height: 71.8%;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: .42%;
      padding: .15%;
      border-radius: 12px;
      background: #4a0913;
      box-shadow: inset 0 0 0 2px #f8ded4aa, 0 0 18px #e34245a8;
      touch-action: none;
      user-select: none;
    }
    .tile {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(3px, .4vw, 5px);
      border: 2px solid var(--drop-color, #8e384088);
      border-radius: clamp(4px, .55vw, 9px);
      background: var(--drop-color, #fff5e5);
      box-shadow: inset 0 0 0 1px #fff8;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      -webkit-user-drag: none;
      user-select: none;
    }
    .tile img { display: block; width: 100%; height: 100%; border-radius: clamp(2px, .35vw, 5px); object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
    .tile.selected { transform: scale(.92); box-shadow: inset 0 0 0 3px var(--gold), 0 0 13px #ffe279; filter: brightness(1.08); }
    .tile.clearing {
      position: relative;
      z-index: 1;
      animation: drop-clear .28s cubic-bezier(.2, .8, .25, 1) both;
      will-change: transform, opacity, filter;
    }
    .tile.clearing::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76%;
      aspect-ratio: 1;
      border: 1px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px 3px var(--drop-color), inset 0 0 9px #fff;
      opacity: 0;
      pointer-events: none;
      animation: drop-ripple .28s ease-out both;
    }
    .tile.hint {
      position: relative;
      z-index: 2;
      outline: 3px solid #ffe279;
      outline-offset: -3px;
      box-shadow: inset 0 0 0 2px #fff, 0 0 14px 4px #ffe279;
      animation: hint-pulse .8s ease-in-out 3;
    }
    @keyframes hint-pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(.9); filter: brightness(1.3); }
    }
    @keyframes drop-clear {
      0% { transform: scale(1); opacity: 1; filter: brightness(1); }
      18% { transform: scale(1.1); opacity: 1; filter: brightness(1.5); }
      100% { transform: scale(.32) rotate(-9deg); opacity: 0; filter: brightness(2); }
    }
    @keyframes drop-ripple {
      0%, 10% { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
      24% { transform: translate(-50%, -50%) scale(.75); opacity: .95; }
      100% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
    }
    .tile:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
    .bottom-panel {
      position: absolute;
      z-index: 3;
      left: 3.1%;
      right: 3.1%;
      bottom: 2.2%;
      min-height: 9.8%;
      display: grid;
      grid-template-columns: minmax(100px, .65fr) minmax(100px, .65fr) 1.7fr auto;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border: 1px solid #fff;
      border-radius: 18px;
      background: #fff8ebef;
      box-shadow: var(--shadow);
    }
    .stat { display: grid; gap: 1px; }
    .stat-label { color: #98636a; font-size: clamp(9px, .85vw, 12px); font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .stat-value { color: var(--wine); font-size: clamp(17px, 2vw, 27px); line-height: 1.05; font-weight: 1000; }
    .instructions { margin: 0; color: #725459; font-size: clamp(10px, 1.12vw, 15px); font-weight: 700; line-height: 1.35; }
    .new-game {
      min-height: 42px;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #d73b48, #a51d30);
      box-shadow: 0 4px 0 #761323;
      color: white;
      font-size: clamp(12px, 1.2vw, 16px);
      font-weight: 1000;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .new-game:active { transform: translateY(3px); box-shadow: 0 1px 0 #761323; }
    .new-game:disabled { opacity: .6; cursor: wait; }
    .status {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 13%;
      transform: translate(-50%, 8px);
      max-width: 86%;
      padding: 9px 15px;
      border: 1px solid #fff;
      border-radius: 999px;
      background: #fff8ebf2;
      box-shadow: var(--shadow);
      color: var(--wine);
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 900;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .status.visible { transform: translate(-50%, 0); opacity: 1; }
    .win-overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #310913a8;
      backdrop-filter: blur(3px);
    }
    .win-overlay[hidden] { display: none; }
    .win-card {
      width: min(92%, 420px);
      padding: clamp(20px, 4vw, 34px);
      border: 2px solid white;
      border-radius: 24px;
      background: var(--cream);
      box-shadow: 0 14px 40px #26000c55;
      text-align: center;
    }
    .win-card h1 { margin: 0 0 10px; color: var(--wine); font-size: clamp(24px, 4vw, 38px); }
    .win-card p { margin: 0 0 20px; color: #725459; font-weight: 700; line-height: 1.5; }
    .donor-wish {
      margin: -6px 0 20px;
      padding: 12px 14px;
      border: 1px solid #f0d1c2;
      border-radius: 14px;
      background: #fff0e8;
      color: #7c2533;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 800;
      line-height: 1.45;
      text-wrap: balance;
    }
    @media (max-width: 900px) and (orientation: portrait) {
      .scene {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        background-image: url("assets/station-background-mobile.png");
        background-size: cover;
        background-position: center top;
      }
      .hud-stack {
        position: absolute;
        z-index: 3;
        top: max(13%, calc(env(safe-area-inset-top) + 96px));
        left: 4%;
        right: 4%;
        display: grid;
        gap: 0;
        padding: 9px 11px;
        border: 1px solid #fff;
        border-radius: 17px;
        background: #fffaf2f5;
        box-shadow: var(--shadow);
      }
      .station-mark {
        top: max(1.2%, calc(env(safe-area-inset-top) + 4px));
        left: 50%;
        right: auto;
        width: clamp(78px, 22%, 100px);
        padding: 4px;
        transform: translateX(-50%);
      }
      .target-panel {
        position: static;
        left: auto; top: auto; width: auto; min-height: 0;
        grid-template-columns: 52px minmax(0, 1fr) auto;
        grid-template-rows: auto auto auto;
        gap: 2px 8px;
        padding: 0 0 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .target-kicker { grid-column: 2 / 4; margin: 0; font-size: 9px; }
      .target-drop { grid-column: 1; grid-row: 1 / 4; width: 52px; border-radius: 9px; }
      .target-name { grid-column: 2; grid-row: 2; font-size: 22px; }
      .target-description { grid-column: 2; grid-row: 3; margin: 0; font-size: 10px; }
      .progress-track { grid-column: 3; grid-row: 2; width: 100%; min-width: 62px; height: 9px; margin: 0; }
      .progress-count { grid-column: 3; grid-row: 3; margin: 0; font-size: 14px; }
      .board {
        left: 50%; top: max(33%, calc(env(safe-area-inset-top) + 244px));
        width: min(93.6%, 60dvh, calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 262px));
        height: auto; aspect-ratio: 1;
        transform: translateX(-50%);
        gap: .48%; padding: 1.1%; border-radius: 17px;
        background: #4a0913f5;
        box-shadow: inset 0 0 0 2px #f8ded4cc, 0 0 22px #e34245a8;
      }
      .tile { border-radius: 5px; }
      .bottom-panel {
        position: static;
        left: auto; right: auto; bottom: auto; min-height: 0;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        gap: 5px 8px;
        padding: 8px 0 0;
        border: 0;
        border-top: 1px solid #ead6d5;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .stat-label { font-size: 7px; }
      .stat-value { font-size: clamp(15px, 4.2vw, 19px); }
      .instructions { grid-column: 1 / 3; grid-row: 2; font-size: 9px; line-height: 1.25; }
      .new-game { grid-column: 3; grid-row: 1 / 3; min-height: 40px; padding: 7px 9px; font-size: 11px; white-space: nowrap; }
      .status { bottom: 7%; border-radius: 14px; }
    }
    @media (max-width: 380px) and (orientation: portrait) {
      .hud-stack { left: 2%; right: 2%; padding: 8px 9px; }
      .target-panel { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 2px 6px; }
      .target-drop { width: 46px; }
      .target-name { font-size: 20px; }
      .target-description { font-size: 9px; }
      .progress-track { min-width: 52px; }
      .board { width: min(96%, 60dvh, calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 262px)); }
      .new-game { padding-inline: 7px; font-size: 10px; }
    }
    @media (max-height: 620px) and (orientation: landscape) {
      .scene { width: min(100vw, 150vh); height: min(100vh, 66.6667vw); }
      .target-panel { top: 24%; min-height: 28%; padding: 3.5%; }
      .bottom-panel { bottom: 1.4%; min-height: 10%; padding: 6px 12px; }
      .new-game { min-height: 34px; padding: 6px 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="scene" aria-label="Гра з краплинками крові">
      <div class="station-mark" role="img" aria-label="Логотип Полтавської обласної станції переливання крові">
        <img src="assets/station-logo.png" alt="">
      </div>

      <div class="hud-stack">
        <section class="target-panel" aria-live="polite" aria-label="Завдання рівня">
          <p class="target-kicker" id="targetKicker">Рівень 1 · ціль</p>
          <img class="target-drop" id="targetDrop" alt="">
          <h1 class="target-name" id="targetName">I+</h1>
          <p class="target-description">Збери краплинки цієї групи</p>
          <div class="progress-track" role="progressbar" id="progressTrack" aria-label="Прогрес завдання" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-count" id="progressCount">0 / 10</div>
        </section>
        <section class="bottom-panel" aria-label="Статистика та керування">
          <div class="stat"><span class="stat-label">Рахунок</span><strong class="stat-value" id="score">0</strong></div>
          <div class="stat"><span class="stat-label">Вдалі ходи</span><strong class="stat-value" id="moves">0</strong></div>
          <p class="instructions">Переставляй сусідні краплинки. Лінія з 3 або більше однакових збирається автоматично.</p>
          <button class="new-game" id="newGame" type="button">Нова гра</button>
        </section>
      </div>

      <div class="board" id="board" role="grid" aria-label="Ігрове поле, 8 на 8"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="win-overlay" id="winOverlay" hidden>
        <section class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
          <h1 id="winTitle">Рівень виконано!</h1>
          <p id="winMessage">Групу зібрано.</p>
          <p class="donor-wish" id="donorWish"></p>
          <button class="new-game" id="playAgain" type="button">Наступний рівень</button>
        </section>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const size = 8;
      const difficultyChances = { relaxed: 0.26, standard: 0.20, challenging: 0.14 };
      const difficultyModes = Object.keys(difficultyChances);
      const donorWishes = [
        "Дякуємо, що даруєте надію — ваша доброта має велику силу.",
        "Нехай добро, яким ви ділитеся, повертається до вас сторицею.",
        "Ваша готовність допомогти — справжній приклад людяності.",
        "Краплина турботи від вас може стати великою підтримкою для когось.",
        "Дякуємо за щедре серце й тепло, яким ви ділитеся.",
        "Ваша доброта надихає інших робити добрі справи.",
        "Нехай у вашому житті буде стільки ж турботи, скільки ви даруєте іншим.",
        "Донорство починається з небайдужості. Дякуємо за ваше велике серце.",
        "Ваш вчинок нагадує: разом ми можемо підтримати одне одного.",
        "Дякуємо, що обираєте шлях милосердя та взаємодопомоги.",
        "Хай кожен день приносить вам радість, яку ви даруєте іншим.",
        "Ваша турбота — промінь надії для тих, кому потрібна підтримка.",
        "Дякуємо, що знаходите сили бути поруч із тими, хто потребує допомоги.",
        "Нехай добро, посіяне вами, розквітає навколо.",
        "Ваше рішення допомогти — прояв відваги й щирого співчуття.",
        "Дякуємо за щирість, небайдужість і бажання підтримати.",
        "Світ стає теплішим завдяки людям, які не проходять повз.",
        "Ваша участь дарує комусь важливу підтримку у складний час.",
        "Нехай ваша доброта надихає, а серце відчуває вдячність.",
        "Дякуємо, що додаєте більше людяності в цей світ.",
        "Ви робите важливу справу — нехай навколо вас множиться добро.",
        "Нехай ваша щедрість повертається світлими зустрічами й добрими новинами.",
        "Дякуємо, що даруєте не лише кров, а й віру у взаємодопомогу.",
        "Ваша небайдужість допомагає творити суспільство, де підтримують одне одного.",
        "Турбота про інших починається з доброго рішення. Дякуємо за ваше.",
        "Нехай вас завжди оточують люди, готові підтримати вас так само щиро, як ви підтримуєте інших.",
        "Ви подаєте приклад, який надихає. Дякуємо за вашу людяність.",
        "Щедрість вашого серця робить світ добрішим.",
        "Дякуємо, що долучаєтеся до справи, у якій важлива кожна краплина.",
        "Нехай у вашому житті буде багато світла — ви щедро ділитеся ним з іншими."
      ];
      const donorWishStorageKey = "blood-group-game-wish-deck";
      const types = [
        { id: "I+", name: "I+", image: "drop-i-plus.png", alt: "Перша позитивна", color: "#4fb9d4" },
        { id: "I−", name: "I−", image: "drop-i-minus.png", alt: "Перша негативна", color: "#9a72d7" },
        { id: "II+", name: "II+", image: "drop-ii-plus.png", alt: "Друга позитивна", color: "#6ebb69" },
        { id: "II−", name: "II−", image: "drop-ii-minus.png", alt: "Друга негативна", color: "#e7a642" },
        { id: "III+", name: "III+", image: "drop-iii-plus.png", alt: "Третя позитивна", color: "#e1748e" },
        { id: "III−", name: "III−", image: "drop-iii-minus.png", alt: "Третя негативна", color: "#4c8ed6" },
        { id: "IV+", name: "IV+", image: "drop-iv-plus.png", alt: "Четверта позитивна", color: "#c8b446" },
        { id: "IV−", name: "IV−", image: "drop-iv-minus.png", alt: "Четверта негативна", color: "#57a8a2" }
      ];
      const imageFor = Object.fromEntries(types.map(type => [type.id, `assets/${type.image}`]));
      const boardElement = document.getElementById("board");
      const targetDrop = document.getElementById("targetDrop");
      const targetName = document.getElementById("targetName");
      const progressTrack = document.getElementById("progressTrack");
      const progressFill = document.getElementById("progressFill");
      const progressCount = document.getElementById("progressCount");
      const targetKicker = document.getElementById("targetKicker");
      const scoreElement = document.getElementById("score");
      const movesElement = document.getElementById("moves");
      const statusElement = document.getElementById("status");
      const winOverlay = document.getElementById("winOverlay");
      const newGameButton = document.getElementById("newGame");
      const winTitle = document.getElementById("winTitle");
      const winMessage = document.getElementById("winMessage");
      const donorWishElement = document.getElementById("donorWish");
      const playAgainButton = document.getElementById("playAgain");
      let cells = [];
      let level = 1;
      let target = types[0].id;
      let goal = 10;
      let collected = 0;
      let score = 0;
      let moves = 0;
      let selected = null;
      let busy = false;
      let complete = false;
      let dragStart = null;
      let suppressClick = false;
      let statusTimer = 0;
      let hintTimer = 0;
      let currentDifficulty = "standard";
      let donorWishDeck = loadDonorWishDeck();

      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const randomTarget = () => types[Math.floor(Math.random() * types.length)].id;
      const randomDifficulty = () => difficultyModes[Math.floor(Math.random() * difficultyModes.length)];
      function loadDonorWishDeck() {
        try {
          const savedDeck = JSON.parse(localStorage.getItem(donorWishStorageKey));
          if (Array.isArray(savedDeck) && savedDeck.every(index => Number.isInteger(index) && index >= 0 && index < donorWishes.length) && new Set(savedDeck).size === savedDeck.length) return savedDeck;
        } catch {}
        return [];
      }
      function shuffledDonorWishDeck() {
        const deck = donorWishes.map((_, index) => index);
        for (let index = deck.length - 1; index > 0; index--) {
          const other = Math.floor(Math.random() * (index + 1));
          [deck[index], deck[other]] = [deck[other], deck[index]];
        }
        return deck;
      }
      function nextDonorWish() {
        if (!donorWishDeck.length) donorWishDeck = shuffledDonorWishDeck();
        const wish = donorWishes[donorWishDeck.pop()];
        try {
          localStorage.setItem(donorWishStorageKey, JSON.stringify(donorWishDeck));
        } catch {}
        return wish;
      }
      function randomType(choices = types) {
        const availableTarget = choices.some(type => type.id === target);
        if (availableTarget && Math.random() < difficultyChances[currentDifficulty]) return target;
        const alternatives = availableTarget ? choices.filter(type => type.id !== target) : choices;
        const pool = alternatives.length ? alternatives : choices;
        return pool[Math.floor(Math.random() * pool.length)].id;
      }
      const coords = index => [Math.floor(index / size), index % size];
      const isAdjacent = (a, b) => {
        const [ar, ac] = coords(a);
        const [br, bc] = coords(b);
        return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
      };

      function findMatches() {
        const matched = new Set();
        for (let row = 0; row < size; row++) {
          let start = 0;
          for (let col = 1; col <= size; col++) {
            const current = col < size ? cells[row * size + col] : null;
            const previous = cells[row * size + col - 1];
            if (current !== previous) {
              if (previous && col - start >= 3) {
                for (let x = start; x < col; x++) matched.add(row * size + x);
              }
              start = col;
            }
          }
        }
        for (let col = 0; col < size; col++) {
          let start = 0;
          for (let row = 1; row <= size; row++) {
            const current = row < size ? cells[row * size + col] : null;
            const previous = cells[(row - 1) * size + col];
            if (current !== previous) {
              if (previous && row - start >= 3) {
                for (let y = start; y < row; y++) matched.add(y * size + col);
              }
              start = row;
            }
          }
        }
        return matched;
      }

      function findHintMove() {
        for (let index = 0; index < cells.length; index++) {
          const neighbors = [];
          if (index % size < size - 1) neighbors.push(index + 1);
          if (index < size * (size - 1)) neighbors.push(index + size);
          for (const other of neighbors) {
            [cells[index], cells[other]] = [cells[other], cells[index]];
            const possible = findMatches().size > 0;
            [cells[index], cells[other]] = [cells[other], cells[index]];
            if (possible) return [index, other];
          }
        }
        return null;
      }

      function hasPossibleMove() {
        return findHintMove() !== null;
      }

      function makeBoard() {
        for (let attempt = 0; attempt < 500; attempt++) {
          const next = [];
          for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
              const excluded = new Set();
              if (col >= 2 && next[row * size + col - 1] === next[row * size + col - 2]) excluded.add(next[row * size + col - 1]);
              if (row >= 2 && next[(row - 1) * size + col] === next[(row - 2) * size + col]) excluded.add(next[(row - 1) * size + col]);
              const choices = types.filter(type => !excluded.has(type.id));
              next.push(randomType(choices));
            }
          }
          cells = next;
          if (hasPossibleMove()) return;
        }
        cells = Array.from({ length: size * size }, (_, index) => types[(index + Math.floor(index / size)) % types.length].id);
      }

      function renderBoard(clear = new Set()) {
        const fragment = document.createDocumentFragment();
        cells.forEach((type, index) => {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = "tile";
          tile.style.setProperty("--drop-color", types.find(item => item.id === type).color);
          if (selected === index && !busy) tile.classList.add("selected");
          if (clear.has(index)) tile.classList.add("clearing");
          tile.dataset.index = String(index);
          tile.setAttribute("role", "gridcell");
          tile.setAttribute("aria-label", `Краплинка ${type}, рядок ${Math.floor(index / size) + 1}, стовпець ${index % size + 1}`);
          tile.setAttribute("aria-selected", String(selected === index));
          tile.tabIndex = selected === null ? (index === 0 ? 0 : -1) : (selected === index ? 0 : -1);
          const image = document.createElement("img");
          image.src = imageFor[type];
          image.alt = `Група ${type}`;
          image.draggable = false;
          tile.append(image);
          fragment.append(tile);
        });
        boardElement.replaceChildren(fragment);
      }

      function clearHint() {
        clearTimeout(hintTimer);
        hintTimer = 0;
        boardElement.querySelectorAll(".tile.hint").forEach(tile => tile.classList.remove("hint"));
      }

      function resetHintTimer() {
        clearHint();
        if (busy || complete || !cells.length) return;
        hintTimer = setTimeout(() => {
          hintTimer = 0;
          if (busy || complete) return;
          const move = findHintMove();
          if (move) move.forEach(index => boardElement.children[index]?.classList.add("hint"));
        }, 15000);
      }

      function updateHud() {
        const type = types.find(item => item.id === target);
        targetKicker.textContent = `Рівень ${level} · ціль`;
        targetDrop.src = imageFor[target];
        targetDrop.alt = `Краплинка групи ${target}`;
        targetDrop.style.setProperty("--drop-color", type.color);
        targetName.textContent = target;
        progressCount.textContent = `${Math.min(collected, goal)} / ${goal}`;
        progressFill.style.width = `${Math.min(100, collected / goal * 100)}%`;
        progressTrack.setAttribute("aria-valuemax", String(goal));
        progressTrack.setAttribute("aria-valuenow", String(Math.min(collected, goal)));
        scoreElement.textContent = score.toLocaleString("uk-UA");
        movesElement.textContent = String(moves);
        newGameButton.disabled = busy;
        if (type) targetName.setAttribute("aria-label", `${type.alt}, група ${type.id}`);
      }

      function showStatus(message) {
        statusElement.textContent = message;
        statusElement.classList.add("visible");
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => statusElement.classList.remove("visible"), 1700);
      }

      function showWin() {
        complete = true;
        clearHint();
        winTitle.textContent = `Рівень ${level} пройдено!`;
        winMessage.textContent = `Зібрано ${goal} краплинок групи ${target}. Рахунок: ${score.toLocaleString("uk-UA")}.`;
        donorWishElement.textContent = nextDonorWish();
        playAgainButton.textContent = "Наступний рівень";
        winOverlay.hidden = false;
        playAgainButton.focus();
      }

      async function resolveBoard() {
        let cascade = 0;
        while (cascade < 30) {
          const matches = findMatches();
          if (!matches.size) break;
          cascade++;
          const targetMatches = [...matches].filter(index => cells[index] === target).length;
          collected += targetMatches;
          score += matches.size * 60 * cascade;
          updateHud();
          renderBoard(matches);
          await wait(window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 300);
          for (const index of matches) cells[index] = null;
          for (let col = 0; col < size; col++) {
            let destination = size - 1;
            for (let row = size - 1; row >= 0; row--) {
              const index = row * size + col;
              if (cells[index] !== null) {
                cells[destination * size + col] = cells[index];
                if (destination !== row) cells[index] = null;
                destination--;
              }
            }
            for (let row = destination; row >= 0; row--) cells[row * size + col] = randomType();
          }
          selected = null;
          renderBoard();
          await wait(135);
        }
        if (cascade >= 30) makeBoard();
        busy = false;
        renderBoard();
        updateHud();
        if (collected >= goal) {
          showWin();
          return;
        }
        if (!hasPossibleMove()) {
          makeBoard();
          renderBoard();
          showStatus("Ходів не залишилося — поле перемішано.");
        }
        resetHintTimer();
      }

      async function swap(first, second) {
        if (busy || complete || !isAdjacent(first, second)) return false;
        clearHint();
        selected = null;
        [cells[first], cells[second]] = [cells[second], cells[first]];
        if (!findMatches().size) {
          [cells[first], cells[second]] = [cells[second], cells[first]];
          renderBoard();
          showStatus("Обміняй краплинки так, щоб утворити лінію з трьох.");
          resetHintTimer();
          return false;
        }
        busy = true;
        moves++;
        renderBoard();
        updateHud();
        await wait(90);
        await resolveBoard();
        return true;
      }

      function selectTile(index) {
        if (busy || complete) return;
        resetHintTimer();
        if (selected === null || selected === index) {
          selected = selected === index ? null : index;
          renderBoard();
          return;
        }
        if (isAdjacent(selected, index)) {
          swap(selected, index);
          return;
        }
        selected = index;
        renderBoard();
      }

      boardElement.addEventListener("click", event => {
        if (suppressClick) { suppressClick = false; return; }
        const tile = event.target.closest(".tile");
        if (tile) selectTile(Number(tile.dataset.index));
      });
      boardElement.addEventListener("pointerdown", event => {
        const tile = event.target.closest(".tile");
        if (!tile || event.button !== 0 || busy || complete) return;
        resetHintTimer();
        dragStart = { index: Number(tile.dataset.index), x: event.clientX, y: event.clientY, pointerId: event.pointerId };
      });
      boardElement.addEventListener("pointerup", event => {
        if (!dragStart || dragStart.pointerId !== event.pointerId) return;
        const start = dragStart;
        dragStart = null;
        const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y);
        if (moved < 14) return;
        const endTile = document.elementFromPoint(event.clientX, event.clientY)?.closest(".tile");
        if (!endTile) return;
        const end = Number(endTile.dataset.index);
        if (isAdjacent(start.index, end)) {
          suppressClick = true;
          swap(start.index, end);
          setTimeout(() => { suppressClick = false; }, 350);
        }
      });
      boardElement.addEventListener("pointercancel", () => { dragStart = null; });
      boardElement.addEventListener("keydown", event => {
        if (selected === null || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const [row, col] = coords(selected);
        const next = {
          ArrowUp: row > 0 ? selected - size : -1,
          ArrowDown: row < size - 1 ? selected + size : -1,
          ArrowLeft: col > 0 ? selected - 1 : -1,
          ArrowRight: col < size - 1 ? selected + 1 : -1
        }[event.key];
        if (next >= 0) swap(selected, next);
      });

      function startLevel() {
        target = randomTarget();
        currentDifficulty = randomDifficulty();
        goal = level * 10;
        collected = 0;
        selected = null;
        busy = false;
        complete = false;
        winOverlay.hidden = true;
        makeBoard();
        renderBoard();
        updateHud();
        resetHintTimer();
      }

      function startNewGame() {
        level = 1;
        score = 0;
        moves = 0;
        startLevel();
      }

      function advanceLevel() {
        level++;
        startLevel();
      }

      newGameButton.addEventListener("click", startNewGame);
      playAgainButton.addEventListener("click", advanceLevel);
      startNewGame();
    })();
  </script>
</body>
</html>
