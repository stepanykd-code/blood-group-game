<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Краплик — перегляд ходьби</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf4e8;color:#463a2f;font-family:system-ui,"Segoe UI",sans-serif}.card{width:min(780px,100%);padding:24px;border:3px solid #b98a50;border-radius:24px;background:#fff8e8;box-shadow:0 8px #8c673f;text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}p{margin:6px 0 18px}.stage{height:460px;display:grid;place-items:center;overflow:hidden;border:2px solid #d5bd8a;border-radius:16px;background-color:#fff;background-image:linear-gradient(45deg,#e5e6df 25%,transparent 25%),linear-gradient(-45deg,#e5e6df 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e6df 75%),linear-gradient(-45deg,transparent 75%,#e5e6df 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.sprite{width:162px;height:432px;background-image:url("kraplyk-walk-sheet.png");background-repeat:no-repeat;background-size:1296px 432px;animation:walk 1.1s steps(8,end) infinite;image-rendering:auto}.paused{animation-play-state:paused}@keyframes walk{to{background-position:-1134px 0}}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:11px 20px;background:#58945e;color:white;font-weight:800;font-size:16px;cursor:pointer}label{font-weight:700}input{accent-color:#58945e}output{min-width:50px;font-variant-numeric:tabular-nums}.hint{margin-top:14px;color:#756655;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>Краплик — ходьба</h1>
  <p>Восьмикадровий цикл. Шахове тло показує прозорість спрайта.</p>
  <div class="stage"><div class="sprite" id="sprite" role="img" aria-label="Краплик іде вправо"></div></div>
  <div class="controls">
    <button id="toggle">⏸ Пауза</button>
    <label for="speed">Швидкість</label>
    <input id="speed" type="range" min="0.55" max="2.2" step="0.05" value="1.1">
    <output id="speedValue">1.1 с</output>
  </div>
  <div class="hint">Якщо фон шаховий, прозорість кадрів збереглася.</div>
</main>
<script>
const sprite=document.querySelector('#sprite'),toggle=document.querySelector('#toggle'),speed=document.querySelector('#speed'),value=document.querySelector('#speedValue');
toggle.addEventListener('click',()=>{const paused=sprite.classList.toggle('paused');toggle.textContent=paused?'▶ Продовжити':'⏸ Пауза'});
speed.addEventListener('input',()=>{sprite.style.animationDuration=`${speed.value}s`;value.value=`${Number(speed.value).toFixed(2)} с`});
</script>
</body>
</html>
